name: unittest

on:
  push:
    branches: [ development, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # build-deps: produces the submodule-sources cache and the native-libraries
  # cache. Runs no D code, so it succeeds regardless of the project source,
  # meaning both caches are saved once they build.
  # ---------------------------------------------------------------------------
  build-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (main repo only, no submodules)
        uses: actions/checkout@v5

      # --- Submodule sources (headers the ImportC build compiles against) ---
      - name: Cache submodule sources
        id: sources-cache
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            app/jni
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Clone submodules (on sources cache miss)
        if: steps.sources-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      # --- Native libraries (compiled .so/.a the D build links against) ------
      - name: Cache native libraries
        id: libs-cache
        uses: actions/cache@v5
        with:
          path: |
            app/jni/SDL/build
            app/jni/SDL_image/build
            app/jni/SDL_mixer/Release
            app/jni/freetype/build
            app/jni/assimp/build
            app/jni/shaderc/build
            app/jni/spirv_cross/build
            app/jni/cvma/build
            app/jni/build
          key: dependencies-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      # Everything below only runs when the native-libraries cache missed.
      - name: System dependencies
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 \
            libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev \
            libasound2-dev libpulse-dev

      - name: Build SDL3
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/SDL && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF -DSDL_SHARED=ON \
                -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_X11_XTEST=OFF -DSDL_EXAMPLES=OFF ../
          cmake --build . --config Release -j$(nproc)

      - name: Build SDL_image
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/SDL_image && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DSDL3_DIR="$PWD/../../SDL/build" \
                -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_WEBP=OFF -DSDLIMAGE_TIF=OFF -DSDLIMAGE_XCF=OFF \
                -DSDLIMAGE_XPM=OFF -DSDLIMAGE_XV=OFF -DSDLIMAGE_LBM=OFF -DSDLIMAGE_PCX=OFF \
                -DSDLIMAGE_PNM=OFF -DSDLIMAGE_QOI=OFF -DSDLIMAGE_SVG=OFF -DSDLIMAGE_TGA=OFF \
                -DSDLIMAGE_GIF=OFF -DSDLIMAGE_ANI=OFF -DSDLIMAGE_SAMPLES=OFF -DSDLIMAGE_TESTS=OFF ../
          cmake --build . --config Release -j$(nproc)

      - name: Build SDL_mixer
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/SDL_mixer && mkdir -p Release && cd Release
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DSDLMIXER_AIFF=OFF -DSDLMIXER_VOC=OFF -DSDLMIXER_AU=OFF -DSDLMIXER_FLAC=OFF \
                -DSDLMIXER_GME=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MP3=OFF -DSDLMIXER_MIDI=OFF \
                -DSDLMIXER_OPUS=OFF -DSDLMIXER_VORBIS_STB=OFF -DSDLMIXER_VORBIS_VORBISFILE=OFF \
                -DSDLMIXER_WAVPACK=OFF -DSDLMIXER_EXAMPLES=OFF -DSDLMIXER_TESTS=OFF \
                -DSDL3_DIR="$PWD/../../SDL/build" ../
          cmake --build . --config Release -j$(nproc)

      - name: Build FreeType
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/freetype && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_ZLIB=ON \
                -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON ../
          cmake --build . --config Release -j$(nproc)

      - name: Build assimp
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/assimp && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DASSIMP_BUILD_TESTS=OFF -DASSIMP_INSTALL=OFF -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
                -DASSIMP_BUILD_ZLIB=ON -DASSIMP_NO_EXPORT=ON -DASSIMP_BUILD_ALL_IMPORTERS_BY_DEFAULT=OFF \
                -DASSIMP_BUILD_FBX_IMPORTER=ON -DASSIMP_BUILD_3DS_IMPORTER=ON -DASSIMP_BUILD_OBJ_IMPORTER=ON ../
          cmake --build . --config Release -j$(nproc)

      - name: Build shaderc
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/shaderc
          python3 utils/git-sync-deps
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DSPIRV_SKIP_EXECUTABLES=ON \
                -DSPIRV_HEADERS_SKIP_EXAMPLES=ON -DSPIRV_HEADERS_SKIP_INSTALL=ON \
                -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_ENABLE_WGSL_OUTPUT=OFF \
                -DSPIRV_TOOLS_BUILD_STATIC=OFF -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON \
                -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DENABLE_GLSLANG_BINARIES=OFF ../
          cmake --build . --config Release -j$(nproc)

      - name: Build spirv_cross
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/spirv_cross && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DSPIRV_CROSS_ENABLE_TESTS=OFF -DSPIRV_CROSS_CLI=OFF -DSPIRV_CROSS_ENABLE_MSL=OFF ../
          cmake --build . --config Release -j$(nproc)

      - name: Build cvma (VMA)
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni/cvma && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ../
          cmake --build . --config Release -j$(nproc)

      - name: Build cimgui
        if: steps.libs-cache.outputs.cache-hit != 'true'
        run: |
          cd app/jni && mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
                -DCIMGUI_USE_SDL3=ON -DVULKAN_DIR=/usr -DSDL3_DIR="$PWD/../SDL" ../
          cmake --build . --config Release -j$(nproc)

  # ---------------------------------------------------------------------------
  # unittest: depends on build-deps. Restores the submodule sources (headers
  # the ImportC build needs) and the native libraries (link targets), then
  # builds and runs the D unittests. May fail on project-source errors without
  # invalidating either cache produced by build-deps.
  # ---------------------------------------------------------------------------
  unittest:
    needs: build-deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (main repo only, no submodules)
        uses: actions/checkout@v5

      # --- Restore submodule sources (headers for ImportC) ------------------
      - name: Restore submodule sources
        id: sources-cache
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            app/jni
          key: submodules-${{ hashFiles('.gitmodules') }}

      - name: Clone submodules (fallback on sources cache miss)
        if: steps.sources-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive

      # --- Restore native libraries (link targets) --------------------------
      - name: Restore native libraries
        uses: actions/cache@v5
        with:
          path: |
            app/jni/SDL/build
            app/jni/SDL_image/build
            app/jni/SDL_mixer/Release
            app/jni/freetype/build
            app/jni/assimp/build
            app/jni/shaderc/build
            app/jni/spirv_cross/build
            app/jni/cvma/build
            app/jni/build
          key: dependencies-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      - name: System dependencies (headers/loader for compile + link)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libudev-dev libdbus-1-dev libasound2-dev libpulse-dev

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Run unittests
        run: dub --build=unittest --force